<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://zlvukgylpcuwpvmkuxgm.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="theme-color" content="#10372e">
  <title>Tài khoản · OT Workspace</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/supabase-workspace.css?v=10">
  <script type="module" src="./assets/js/supabase-auth-check.js?v=12"></script>
</head>
<body>
  <header class="account-header">
    <div class="account-header-inner">
      <div class="account-brand">
        <span class="account-mark" aria-hidden="true">OT</span>
        <strong>OT Workspace</strong>
      </div>
      <button id="logout" type="button" hidden>Đăng xuất</button>
    </div>
  </header>
  <main class="account-main">
    <p id="status" role="status" aria-live="polite" hidden></p>
    <p id="error" role="alert" hidden></p>
    <section id="auth" aria-label="Tài khoản">
      <nav class="account-nav" aria-label="Thao tác tài khoản">
        <button type="button" data-auth="login">Đăng nhập</button>
        <button type="button" data-auth="register">Đăng ký</button>
        <button type="button" data-auth="set-password">Thư mời / Quên mật khẩu</button>
      </nav>
      <form id="login" class="account-card">
        <h1>Đăng nhập</h1>
        <label>Email BIDV<input name="email" type="email" autocomplete="username" required></label>
        <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary">Đăng nhập</button>
      </form>
      <form id="register" class="account-card" hidden>
        <h1>Đăng ký</h1>
        <label>Email BIDV<input name="email" type="email" autocomplete="email" required></label>
        <fieldset id="signup-fields">
          <label>Họ tên đầy đủ<input name="fullName" autocomplete="name" maxlength="200" required></label>
          <label>Mã cán bộ<input name="employeeCode" inputmode="numeric" pattern="[0-9]{1,8}" maxlength="8" required></label>
          <label>Mật khẩu<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
        </fieldset>
        <fieldset id="signup-otp" hidden disabled>
          <label>Mã OTP đăng ký<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" required></label>
        </fieldset>
        <div class="account-actions">
          <button id="signup-submit" class="primary">Đăng ký</button>
          <button id="open-otp" type="button" aria-controls="signup-otp">Đã đăng ký? Nhập mã OTP</button>
          <button id="resend" type="button" hidden>Gửi lại mã OTP</button>
          <button id="edit-signup" type="button" hidden>Sửa thông tin đăng ký</button>
        </div>
      </form>
      <form id="set-password" class="account-card" hidden>
        <h1>Đặt mật khẩu</h1>
        <label>Email BIDV<input name="email" type="email" autocomplete="email" required></label>
        <label>Loại mã
          <select name="mode">
            <option value="invite">Mã trong thư mời</option>
            <option value="recovery">Mã đặt lại mật khẩu</option>
          </select>
        </label>
        <label>Mã OTP<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" required></label>
        <label>Mật khẩu mới<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <div class="account-actions">
          <button class="primary">Lưu mật khẩu</button>
          <button type="button" id="send-password-reset">Gửi mã đặt lại mật khẩu</button>
        </div>
      </form>
      <a class="legacy-link" href="./?legacy=1#/backup">Mở bản cục bộ để sao lưu dữ liệu cũ</a>
    </section>
    <section id="profile" class="account-card" aria-label="Hồ sơ" hidden></section>
    <div id="ot-workspace" hidden></div>
  </main>
  <footer class="account-footer">made by Longbq</footer>
</body>
</html>
